<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meus Guias · 100+ Brinquedos de Madeira</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3B2412">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:M;src:url(/assets/funil/m800.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:M;src:url(/assets/funil/m900.woff2) format('woff2');font-weight:900;font-display:swap}
:root{--bg:#F7F0E4;--card:#fff;--ink:#2B1B0E;--mu:#6E5B49;--line:#E6D8C4;--brown:#3B2412;--or:#C4651B;--or2:#E9A23B;--gr:#1F8A4C;--soft:#FBEFD9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:M,system-ui,sans-serif;font-weight:900;line-height:1.15}
em{font-style:normal;color:var(--or)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 40px}
/* topo */
.top{background:var(--brown);color:#F7F0E6;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
.top .ttl{font:900 17px/1.15 M,system-ui;flex:1}
.top .ttl small{display:block;font:400 13px system-ui;color:#d9c4a8;margin-top:2px}
.back{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;font-weight:700;font-size:16px;color:#fff;white-space:nowrap}
.exit{font-size:14px;color:#d9c4a8;text-decoration:underline;padding:8px 2px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px;background:radial-gradient(ellipse at 50% -10%,#6a4020,#2a170a 70%);color:#F7F0E6;text-align:center}
.login .box{max-width:440px;margin:0 auto;width:100%}
.login img.cv{width:min(62vw,240px);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.5);margin-bottom:22px}
.login h1{font-size:28px;margin-bottom:10px}
.login h1 em{color:#FFD27A}
.login p{color:#e0cfb6;margin-bottom:20px;font-size:18px}
.login input{width:100%;font:inherit;font-size:20px;padding:17px 16px;border-radius:14px;border:3px solid transparent;background:#fff;color:#222;text-align:center;outline:0}
.login input:focus{border-color:var(--or2)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-weight:800;font-size:20px;padding:17px 18px;border-radius:14px;text-decoration:none;text-align:center;min-height:58px}
.btn.go{background:var(--gr);color:#fff;margin-top:14px;box-shadow:0 6px 0 #166a39}
.btn.go:active{transform:translateY(3px);box-shadow:0 3px 0 #166a39}
.err{background:#FFE9E4;color:#8a2a14;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:16px;text-align:left}
.help{margin-top:18px;font-size:15px;color:#d9c4a8}
/* home */
.hello{padding:22px 0 6px}
.hello h1{font-size:26px}
.hello p{color:var(--mu);margin-top:6px}
.sec{font:900 14px M,system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;height:2px;background:var(--line)}
.pcard{display:block;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(60,36,18,.12);margin-bottom:16px;text-decoration:none;position:relative}
.pcard img.cv{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.pcard .bd{padding:16px 18px 18px}
.pcard h3{font-size:21px;margin-bottom:6px}
.pcard p{color:var(--mu);font-size:16px;margin-bottom:14px}
.tag{position:absolute;top:12px;left:12px;background:var(--gr);color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:30px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn.open{background:var(--or);color:#fff;box-shadow:0 5px 0 #8f4510}
.btn.open:active{transform:translateY(3px);box-shadow:0 2px 0 #8f4510}
.pcard.lock img.cv{filter:grayscale(1) brightness(.85);opacity:.75}
.pcard.lock .tag{background:#444}
.pcard.lock .price{font-weight:800;font-size:19px;margin-bottom:12px}
.pcard.lock .price s{color:#999;font-weight:500;font-size:16px;margin-right:6px}
.btn.buy{background:var(--or2);color:#2b1b0e;box-shadow:0 5px 0 #b97a1c}
.btn.buy:active{transform:translateY(3px);box-shadow:0 2px 0 #b97a1c}
.note{background:var(--soft);border:2px dashed #E3C48C;border-radius:16px;padding:14px 16px;font-size:16px;color:#5b4326;margin:6px 0 4px}
.link{display:block;text-align:center;color:var(--or);font-weight:700;text-decoration:underline;padding:14px;font-size:16px}
.foot{text-align:center;color:var(--mu);font-size:14px;padding:24px 0 8px}
/* produto */
.phead{display:flex;gap:14px;align-items:center;padding:20px 0 4px}
.phead img{width:92px;height:92px;border-radius:16px;object-fit:cover;box-shadow:0 4px 14px rgba(60,36,18,.25)}
.phead h1{font-size:22px}
.phead p{color:var(--mu);font-size:15px;margin-top:4px}
.tip{background:#fff;border-left:6px solid var(--or2);border-radius:12px;padding:12px 14px;font-size:16px;margin:14px 0 2px;box-shadow:0 2px 8px rgba(60,36,18,.08)}
.item{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 3px 12px rgba(60,36,18,.1)}
.item .row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.item img{width:64px;height:90px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);background:#fff;flex:none}
.item h3{font-size:18px;line-height:1.2}
.item .sub{font-size:15px;color:var(--mu);margin-top:3px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .b{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:18px;padding:14px 8px;border-radius:12px;text-decoration:none;min-height:54px;text-align:center}
.b.dl{background:var(--or);color:#fff}
.b.pr{background:var(--brown);color:#fff}
.b:active{filter:brightness(.9)}
.view{display:block;text-align:center;margin-top:10px;font-size:16px;color:var(--or);font-weight:700;text-decoration:underline;padding:6px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));background:#2b1b0e;color:#fff;padding:14px 16px;border-radius:14px;font-size:16px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:520px;margin:0 auto}
.spin{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--mu)}
@media (min-width:700px){html{font-size:19px}}
@media print{.top,.toast{display:none}}
</style></head>
<body>
<div id="app"><div class="spin">Carregando…</div></div>
<script>
/* =====================================================================
   ÁREA DE MEMBROS · 100+ BRINQUEDOS DE MADEIRA
   Para trocar links de compra, preços ou textos, edite só este bloco.
   ===================================================================== */
const CFG = {
  SUPORTE_EMAIL: '',                                   // e-mail de suporte (aparece no login quando preenchido)
  SUPA_URL: 'https://xdhxqwuqqragiokbpomx.supabase.co',                                        // https://xxxx.supabase.co
  SUPA_KEY: 'sb_publishable_mkRibeQMVu9fQ3eS1ZoiSA_uHwdsDoY',                                        // chave pública (sb_publishable_...)
  ALLOW_PDF_DOWNLOAD: true                             // neste produto a pessoa pode baixar e imprimir
};
const A = 'assets/';
const PDF = {g0:'g0-f2892e9864.pdf',g1:'g1-b19aefad2f.pdf',g2:'g2-29e742ecdd.pdf',g3:'g3-54de8f70ac.pdf',g4:'g4-5a6d75bec0.pdf',g5:'g5-e01ece9355.pdf',g6:'g6-8fa03cc528.pdf',g7:'g7-3e09cb9255.pdf',g8:'g8-e16770d6b9.pdf',b1:'b1-9830156dcd.pdf',b2:'b2-8af666e4eb.pdf',b3:'b3-f72a0d1612.pdf',pallet:'pallet-b464316cc1.pdf',antigo:'antigo-03dc7f7c7e.pdf',jogos:'jogos-d382322bc4.pdf'};
const it = (k, title, sub, name) => ({ id: k, title, sub, file: PDF[k], thumb: 't-' + k + '.webp', name: name || title });

/* PRODUTOS. kind 'main' = o que ela comprou primeiro; 'bump' = os que podem ficar bloqueados.
   buy = link de compra. Hoje vai direto para o checkout; depois pode trocar por uma página de vendas. */
const PRODUCTS = [
  { id: 'brq', kind: 'main', title: '100+ Brinquedos de Madeira', cover: 'c-main.webp',
    desc: '102 projetos com moldes em tamanho real, medidas, lista de materiais e passo a passo.',
    sections: [
      { title: 'Comece por aqui', items: [ it('g0', 'Comece aqui e índice', 'Leia primeiro · 7 páginas', 'Comece Aqui e Indice') ] },
      { title: 'Moldes para baixar e imprimir', items: [
        it('g1', 'Cavalinhos e Bichinhos', '15 projetos · 46 páginas', 'Guia 1 - Cavalinhos e Bichinhos'),
        it('g2', 'Caminhões, Carros e Veículos', '21 projetos · 47 páginas', 'Guia 2 - Caminhoes Carros e Veiculos'),
        it('g3', 'Aviões e Barcos', '12 projetos · 34 páginas', 'Guia 3 - Avioes e Barcos'),
        it('g4', 'Máquinas de Construção', '10 projetos · 27 páginas', 'Guia 4 - Maquinas de Construcao'),
        it('g5', 'Bichos da Fazenda', '10 projetos · 24 páginas', 'Guia 5 - Bichos da Fazenda'),
        it('g6', 'Para as Meninas', '9 projetos · 37 páginas', 'Guia 6 - Para as Meninas'),
        it('g7', 'Natal e Datas Especiais', '15 projetos · 39 páginas', 'Guia 7 - Natal e Datas Especiais'),
        it('g8', 'Quebra-cabeças e Jogos', '10 projetos · 37 páginas', 'Guia 8 - Quebra-cabecas e Jogos') ] },
      { title: 'Seus 3 bônus', items: [
        it('b1', 'Bônus 1 · Guia do Iniciante', '11 páginas', 'Bonus 1 - Guia do Iniciante'),
        it('b2', 'Bônus 2 · Acabamentos Seguros e Madeiras Atóxicas', '8 páginas', 'Bonus 2 - Acabamentos Seguros'),
        it('b3', 'Bônus 3 · Certificado do Brinquedo de Família', '7 páginas', 'Bonus 3 - Certificado') ] }
    ] },
  { id: 'pallet', kind: 'bump', title: '50 Projetos de Pallet', cover: 'c-pallet.webp',
    desc: 'Móveis e peças úteis para casa, varanda e quintal, feitos com pallet. Desenho e medidas prontos.',
    price: 'R$ 37,00', buy: 'https://checkout.payt.com.br/7ab1d58dc1877358ceaac111ad8342e0',
    sections: [ { title: 'Seu guia', items: [ it('pallet', '50 Projetos de Pallet', 'Guia completo · 57 páginas', '50 Projetos de Pallet') ] } ] },
  { id: 'antigo', kind: 'bump', title: '20 Brinquedos de Antigamente', cover: 'c-antigo.webp',
    desc: 'Pião, ioiô, bilboquê, pernas de pau e carrinho de rolimã. Brinquedos que o neto guarda pra vida toda.',
    price: 'R$ 25,00', buy: 'https://checkout.payt.com.br/fc7846c1f47b78dbe7f9595bd44539d7',
    sections: [ { title: 'Seu guia', items: [ it('antigo', '20 Brinquedos de Antigamente', 'Guia completo · 47 páginas', '20 Brinquedos de Antigamente') ] } ] },
  { id: 'jogos', kind: 'bump', title: '25 Jogos de Tabuleiro em Madeira', cover: 'c-jogos.webp',
    desc: 'Damas, xadrez, trilha, ludo, dominó e mancala. Jogos que juntam a família na mesa.',
    price: 'R$ 19,90', buy: 'https://checkout.payt.com.br/be248e45f4549e9c64f93b8654a91daa',
    sections: [ { title: 'Seu guia', items: [ it('jogos', '25 Jogos de Tabuleiro em Madeira', 'Guia completo · 32 páginas', '25 Jogos de Tabuleiro em Madeira') ] } ] }
];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const S = { email: null, name: null, owned: [] };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
async function rpc(fn, args) {
  const r = await fetch(CFG.SUPA_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: CFG.SUPA_KEY, Authorization: 'Bearer ' + CFG.SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error('rpc ' + r.status);
  return r.json();
}
function track(kind, text) { if (S.email) rpc('app_event', { p_email: S.email, p_kind: kind, p_text: text, p_device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'celular' : 'computador' }).catch(() => {}); }
const owns = id => S.owned.indexOf(id) > -1;
const firstName = n => { n = (n || '').trim().split(/\s+/)[0] || ''; return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : ''; };
function toast(msg, ms) {
  const o = $('.toast'); if (o) o.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms || 6000);
}
const isMobile = () => /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);

/* ---------- login ---------- */
async function doLogin(email) {
  email = (email || '').trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) return { ok: false, msg: 'Digite o e-mail completo, por exemplo: maria@gmail.com' };
  let d;
  try { d = await rpc('app_login', { p_email: email }); }
  catch (e) { return { ok: false, msg: 'Não deu para conectar agora. Confira a internet e tente de novo.' }; }
  if (!d || !d.ok) {
    return { ok: false, msg: 'Não encontramos nenhuma compra com este e-mail. Use o mesmo e-mail que você digitou na hora de comprar.' + (CFG.SUPORTE_EMAIL ? ' Se precisar de ajuda, escreva para ' + CFG.SUPORTE_EMAIL + '.' : '') };
  }
  const mine = (d.owned || []).filter(id => PRODUCTS.some(p => p.id === id));
  if (!mine.length) return { ok: false, msg: 'Não encontramos nenhuma compra com este e-mail. Use o mesmo e-mail que você digitou na hora de comprar.' + (CFG.SUPORTE_EMAIL ? ' Se precisar de ajuda, escreva para ' + CFG.SUPORTE_EMAIL + '.' : '') };
  S.email = email; S.name = d.name || ''; S.owned = mine;
  store.set('bpm_email', email);
  return { ok: true };
}
async function refreshOwned() {
  if (!S.email) return;
  try { const d = await rpc('app_login', { p_email: S.email }); if (d && d.ok) { S.owned = (d.owned || []).filter(id => PRODUCTS.some(p => p.id === id)); S.name = d.name || S.name; } } catch (e) {}
}
function logout() { store.del('bpm_email'); S.email = null; S.owned = []; location.hash = ''; render(); }

/* ---------- telas ---------- */
function viewLogin(msg) {
  return `<div class="login"><div class="box">
    <img class="cv" src="${A}img/c-main.webp" alt="">
    <h1>Seus guias de <em>brinquedos de madeira</em></h1>
    <p>Digite o e-mail que você usou na compra para entrar. Não precisa de senha.</p>
    <form id="f" autocomplete="on">
      <input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="seu@email.com" required value="${esc(store.get('bpm_email') || '')}">
      <button class="btn go" type="submit" id="gb">Entrar</button>
    </form>
    <div id="msg">${msg ? `<div class="err">${esc(msg)}</div>` : ''}</div>
    <div class="help">${CFG.SUPORTE_EMAIL ? 'Precisa de ajuda? ' + esc(CFG.SUPORTE_EMAIL) : ''}</div>
  </div></div>`;
}
function topbar(title, sub, back) {
  return `<div class="top"><div class="in">${back ? `<button class="back" id="bk">‹ Voltar</button>` : ''}<div class="ttl">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>${back ? '' : `<button class="exit" id="ex">Sair</button>`}</div></div>`;
}
function viewHome() {
  const mine = PRODUCTS.filter(p => owns(p.id));
  const locked = PRODUCTS.filter(p => !owns(p.id));
  const nm = firstName(S.name);
  let h = topbar('Meus Guias', '100+ Brinquedos de Madeira', false) + `<div class="wrap">
    <div class="hello"><h1>${nm ? 'Olá, ' + esc(nm) + '!' : 'Olá!'}</h1><p>${mine.length > 1 ? 'Estes são os seus guias. Toque em um para abrir.' : 'Este é o seu guia. Toque no botão para abrir.'}</p></div>
    <div class="sec">Seus guias</div>`;
  mine.forEach(p => {
    h += `<a class="pcard" href="#/p/${p.id}"><span class="tag">✓ Liberado</span><img class="cv" src="${A}img/${p.cover}" alt="${esc(p.title)}">
      <div class="bd"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><span class="btn open">Abrir meu guia</span></div></a>`;
  });
  if (locked.length) {
    h += `<div class="sec">Outros guias para você</div>
    <div class="note">Estes guias ainda não foram liberados para você. Toque em um para ver e garantir o seu.</div>`;
    locked.forEach(p => {
      h += `<a class="pcard lock" data-buy="${p.id}" href="${esc(p.buy || '#')}"><span class="tag">🔒 Bloqueado</span><img class="cv" src="${A}img/${p.cover}" alt="${esc(p.title)}">
      <div class="bd"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><div class="price">${esc(p.price)}</div><span class="btn buy">Quero este guia</span></div></a>`;
    });
  }
  h += `<button class="link" id="rf">Já comprei e ainda não apareceu? Toque aqui para atualizar</button>
    <div class="foot">${CFG.SUPORTE_EMAIL ? 'Suporte: ' + esc(CFG.SUPORTE_EMAIL) + '<br>' : ''}Conectado como ${esc(S.email)}</div></div>`;
  return h;
}
function viewProduct(p) {
  let h = topbar(p.title, '', true) + `<div class="wrap">
    <div class="phead"><img src="${A}img/${p.cover}" alt=""><div><h1>${esc(p.title)}</h1><p>${esc(p.desc)}</p></div></div>
    <div class="tip">Para <b>imprimir</b>, toque em <b>Imprimir</b> e escolha a sua impressora. Imprima os moldes em <b>tamanho 100%</b> (sem “ajustar à página”).</div>`;
  p.sections.forEach(sec => {
    h += `<div class="sec">${esc(sec.title)}</div>`;
    sec.items.forEach(i => {
      const url = A + 'pdf/' + i.file;
      h += `<div class="item"><div class="row"><img src="${A}img/${i.thumb}" alt="" loading="lazy"><div><h3>${esc(i.title)}</h3><div class="sub">${esc(i.sub)}</div></div></div>
        <div class="acts"><a class="b dl" href="${url}" download="${esc(i.name)}.pdf" data-t="${esc(i.title)}">⬇ Baixar</a><button class="b pr" data-print="${url}" data-t="${esc(i.title)}">🖨 Imprimir</button></div>
        <a class="view" href="${url}" target="_blank" rel="noopener" data-v="${esc(i.title)}">Ver na tela</a></div>`;
    });
  });
  h += `<div class="foot">${CFG.SUPORTE_EMAIL ? 'Suporte: ' + esc(CFG.SUPORTE_EMAIL) : ''}</div></div>`;
  return h;
}

/* ---------- imprimir ---------- */
function printPdf(url, title) {
  track('imprimir', title);
  if (isMobile()) {
    window.open(url, '_blank');
    toast('O guia abriu em outra tela. Toque no menu (três pontinhos ou o ícone de compartilhar) e escolha Imprimir.', 9000);
    return;
  }
  toast('Preparando para imprimir… aguarde alguns segundos.', 5000);
  let f = $('#pf'); if (f) f.remove();
  f = document.createElement('iframe'); f.id = 'pf'; f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
  f.onload = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.open(url, '_blank'); } };
  f.src = url; document.body.appendChild(f);
}

/* ---------- roteamento ---------- */
function render() {
  const app = $('#app');
  if (!S.email) {
    app.innerHTML = viewLogin();
    const f = $('#f');
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const b = $('#gb'); b.disabled = true; b.textContent = 'Entrando…';
      const r = await doLogin($('#em').value);
      if (r.ok) { track('login', 'Entrou no app'); location.hash = ''; render(); }
      else { b.disabled = false; b.textContent = 'Entrar'; $('#msg').innerHTML = `<div class="err">${esc(r.msg)}</div>`; }
    });
    return;
  }
  const m = location.hash.match(/^#\/p\/(\w+)/);
  const p = m && PRODUCTS.find(x => x.id === m[1]);
  if (p && owns(p.id)) {
    app.innerHTML = viewProduct(p); window.scrollTo(0, 0);
    $('#bk').onclick = () => { location.hash = ''; };
    track('abriu', p.title);
    app.querySelectorAll('[data-print]').forEach(b => b.onclick = () => printPdf(b.dataset.print, b.dataset.t));
    app.querySelectorAll('a.dl').forEach(a => a.addEventListener('click', () => track('baixou', a.dataset.t)));
    app.querySelectorAll('a.view').forEach(a => a.addEventListener('click', () => track('viu', a.dataset.v)));
    return;
  }
  if (p) { location.hash = ''; return; }
  app.innerHTML = viewHome(); window.scrollTo(0, 0);
  $('#ex').onclick = logout;
  $('#rf').onclick = async () => { $('#rf').textContent = 'Atualizando…'; await refreshOwned(); render(); toast('Lista atualizada.', 2500); };
  app.querySelectorAll('[data-buy]').forEach(a => a.addEventListener('click', e => {
    const p = PRODUCTS.find(x => x.id === a.dataset.buy);
    track('interesse', 'Clicou para comprar: ' + p.title);
    store.set('bpm_buying', String(Date.now()));
    if (!p.buy) { e.preventDefault(); toast('Em breve você poderá garantir este guia por aqui.', 4000); }
  }));
}
window.addEventListener('hashchange', render);
/* ao voltar do checkout, atualiza o que ela já comprou */
async function onBack() {
  if (!S.email || !store.get('bpm_buying')) return;
  store.del('bpm_buying'); const before = S.owned.length;
  await refreshOwned(); if (S.owned.length !== before) { render(); toast('Seu novo guia foi liberado!', 5000); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) onBack(); });
window.addEventListener('pageshow', e => { if (e.persisted) onBack(); });

(async function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const saved = store.get('bpm_email');
  if (saved) { const r = await doLogin(saved); if (!r.ok) { render(); return; } }
  render();
})();
</script></body></html>
